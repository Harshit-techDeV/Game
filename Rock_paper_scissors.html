<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-scissors</title>
    <link rel="stylesheet" href="Rock_paper_scissors.css">  
</head>
<body>
    <h1>Rock-Paper-Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://supersimple.dev/projects/rock-paper-scissors/images/rock-emoji.png" >
        </div>
        <div class="choice" id="paper">
            <img src="https://whosinghajay.github.io/rockpaperscissorGame/images/paper-emoji.png">
        </div>
        <div class="choice" id="scissors" >
            <img src="https://whosinghajay.github.io/rockpaperscissorGame/images/scissors-emoji.png" >
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
    <script src="Rock_paper_scissors.js"></script>
</body>
</html>
